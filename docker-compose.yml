# Solar Tracking System — docker-compose
# Usage:
#   docker-compose up          # backend + simulator
#   docker-compose up backend  # backend only
services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SOLAR_DEVICE_ID=${SOLAR_DEVICE_ID:-solar-tracker-01}
      - SOLAR_OFFLINE_AFTER=${SOLAR_OFFLINE_AFTER:-10}
      - SOLAR_COMMAND_EXPIRE=${SOLAR_COMMAND_EXPIRE:-60}
      - SOLAR_DB_PATH=/app/data/solar_tracker.db
    volumes:
      # Persist the SQLite database across restarts
      - solar_db:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  simulator:
    build: .
    command: python -m simulator.device_sim --host backend --port 8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  solar_db:
